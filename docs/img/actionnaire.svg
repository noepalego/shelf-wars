<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" class="s" role="img" aria-label="Revue de l'actionnaire, 31 janvier"><style>
.s{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e0;--axis:#b9b7ae;
